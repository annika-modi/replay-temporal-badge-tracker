<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Replay 2026 — Live Badge Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:     #000000;
  --white:     #ffffff;
  --lime:      #c8ff00;
  --periwinkle:#a0aeff;
  --dim:       #111111;
  --faint:     #1e1e1e;
  --muted:     #555555;
  --mono:      'Space Mono', monospace;
  --display:   'Bebas Neue', sans-serif;
  --body:      'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: var(--black);
  color: var(--white);
  font-family: var(--body);
}

/* scanline */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
  pointer-events: none;
  z-index: 999;
}

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
#shell {
  display: grid;
  grid-template-rows: 72px 1fr 26px;
  grid-template-columns: 88px 1fr;
  width: 100vw;
  height: 100vh;
}

/* ── TOPBAR ─────────────────────────────────────────────────────────────── */
#topbar {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--faint);
  background: var(--black);
  position: relative;
  z-index: 50;
  padding: 0 24px;
}

/* centered logo */
#logo-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: default;
  transition: all 0.25s;
  text-decoration: none;
}

#logo-replay {
  font-family: var(--display);
  font-size: 32px;
  letter-spacing: 0.12em;
  color: var(--white);
  line-height: 1;
  transition: color 0.25s, text-shadow 0.25s;
}

#logo-sub {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
  transition: color 0.25s;
}

#logo-wrap:hover #logo-replay {
  color: var(--lime);
  text-shadow: 0 0 20px var(--lime), 0 0 40px rgba(200,255,0,0.3);
}
#logo-wrap:hover #logo-sub {
  color: var(--periwinkle);
}

/* status right */
#status-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 20px;
}

.stat-item {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}

.stat-item span { color: var(--white); }

#live-indicator {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--muted);
}

#live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  transition: all 0.3s;
}
#live-dot.on {
  background: var(--lime);
  box-shadow: 0 0 8px var(--lime), 0 0 16px rgba(200,255,0,0.4);
}
#live-dot.on ~ #live-text { color: var(--lime); }

/* ── FLOOR PANEL ────────────────────────────────────────────────────────── */
#floor-panel {
  grid-column: 1;
  grid-row: 2;
  border-right: 1px solid var(--faint);
  background: var(--black);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 20px 0;
  position: relative;
  z-index: 40;
  perspective: 600px;
}

/* Isometric floor stack — 2 floors viewed from slight angle */
.floor-layer {
  width: 60px;
  height: 32px;
  border: 1px solid #333;
  background: #0a0a0a;
  cursor: pointer;
  position: relative;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1px;
  /* 3D stack effect — each floor offset */
  margin-bottom: -1px;
  transform-origin: bottom center;
}

/* Top floor (Concourse) */
.floor-layer:first-child {
  transform: rotateX(30deg) translateY(-6px);
  border-radius: 3px 3px 0 0;
  z-index: 2;
}

/* Bottom floor (Level 00) */
.floor-layer:last-child {
  transform: rotateX(30deg) translateY(6px);
  border-radius: 0 0 3px 3px;
  z-index: 1;
  margin-top: 2px;
}

.floor-layer:hover {
  border-color: var(--muted);
  background: #161616;
}

.floor-layer.active {
  border-color: var(--lime) !important;
  background: rgba(200,255,0,0.07) !important;
  box-shadow:
    0 0 12px rgba(200,255,0,0.2),
    inset 0 0 10px rgba(200,255,0,0.06);
}

.floor-layer.active .fl-num { color: var(--lime); }
.floor-layer.active .fl-lbl { color: rgba(200,255,0,0.6); }

/* Active glow pulse */
.floor-layer.active::before {
  content: '';
  position: absolute;
  inset: -1px;
  border: 1px solid var(--lime);
  border-radius: inherit;
  opacity: 0.4;
  animation: floorpulse 2.5s ease-in-out infinite;
}

@keyframes floorpulse {
  0%, 100% { opacity: 0.2; }
  50%       { opacity: 0.7; }
}

.fl-num {
  font-family: var(--display);
  font-size: 15px;
  line-height: 1;
  color: var(--muted);
  letter-spacing: 0.06em;
  transition: color 0.2s;
}

.fl-lbl {
  font-family: var(--mono);
  font-size: 6px;
  letter-spacing: 0.12em;
  color: #333;
  text-transform: uppercase;
  transition: color 0.2s;
}

/* connector line between floors */
#floor-panel::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 1px;
  height: 12px;
  background: var(--faint);
}

/* ── MAP AREA ───────────────────────────────────────────────────────────── */
#map-area {
  grid-column: 2;
  grid-row: 2;
  position: relative;
  overflow: hidden;
  background: #050505;
}

/* Floor title overlay */
#floor-title {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 0.5em;
  color: rgba(255,255,255,0.12);
  text-transform: uppercase;
  pointer-events: none;
  z-index: 5;
  white-space: nowrap;
}

/* corner reticles */
/* reticles now live inside map-root */
.reticle {
  position: absolute;
  width: 18px; height: 18px;
  pointer-events: none;
  z-index: 6;
}
.reticle::before, .reticle::after {
  content: '';
  position: absolute;
  background: rgba(200,255,0,0.4);
}
.rt { top: 14px; left: 14px; }
.rt::before { top: 0; left: 0; width: 1px; height: 18px; }
.rt::after  { top: 0; left: 0; height: 1px; width: 18px; }
.rr { top: 14px; right: 14px; }
.rr::before { top: 0; right: 0; width: 1px; height: 18px; }
.rr::after  { top: 0; right: 0; height: 1px; width: 18px; }
.rb { bottom: 14px; left: 14px; }
.rb::before { bottom: 0; left: 0; width: 1px; height: 18px; }
.rb::after  { bottom: 0; left: 0; height: 1px; width: 18px; }
.rl { bottom: 14px; right: 14px; }
.rl::before { bottom: 0; right: 0; width: 1px; height: 18px; }
.rl::after  { bottom: 0; right: 0; height: 1px; width: 18px; }

/* sweep scan */
#map-area::after {
  content: '';
  position: absolute;
  top: -60%;
  left: 0; right: 0;
  height: 60%;
  background: linear-gradient(to bottom, transparent, rgba(200,255,0,0.012) 50%, transparent);
  animation: sweep 10s linear infinite;
  pointer-events: none;
  z-index: 4;
}
@keyframes sweep { 0% { top: -60%; } 100% { top: 120%; } }

#map-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

#map-root {
  position: relative;
  transition: opacity 0.2s;
}
#map-root.switching { opacity: 0; }

#map-root img {
  display: block;
  width: 100%; height: 100%;
  user-select: none;
  pointer-events: none;
  filter: brightness(0.93) contrast(1.04);
}

#dot-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ── Table markers ── */
.table-marker {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: all;
  cursor: default;
}
.table-rect {
  width: 14px; height: 10px;
  border-radius: 2px;
  background: rgba(200,255,0,0.06);
  border: 1px solid rgba(200,255,0,0.25);
  transition: all 0.15s;
}
.table-marker:hover .table-rect {
  background: rgba(200,255,0,0.18);
  border-color: var(--lime);
}
.table-label {
  position: absolute;
  top: -19px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 7px;
  color: var(--lime);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  background: rgba(0,0,0,0.85);
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: 0.05em;
}
.table-marker:hover .table-label { opacity: 1; }

/* ── Badge dots ── */
.badge-dot {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: all;
  cursor: pointer;
  z-index: 10;
}
.badge-pip {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 0 2px rgba(200,255,0,0.25), 0 0 14px var(--lime);
  animation: pip-pulse 2.5s ease-in-out infinite;
}
@keyframes pip-pulse {
  0%,100% { box-shadow: 0 0 0 2px rgba(200,255,0,0.2), 0 0 10px var(--lime); }
  50%      { box-shadow: 0 0 0 5px rgba(200,255,0,0.08), 0 0 22px var(--lime); }
}
.badge-label {
  position: absolute;
  top: -21px; left: 50%;
  transform: translateX(-50%);
  background: var(--black);
  border: 1px solid var(--lime);
  color: var(--lime);
  font-family: var(--mono);
  font-size: 8px;
  padding: 2px 6px;
  border-radius: 2px;
  white-space: nowrap;
  pointer-events: none;
  letter-spacing: 0.06em;
}

/* ── Legend ── */
#legend {
  position: absolute;
  bottom: 18px;
  right: 18px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  z-index: 20;
}
.leg-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.leg-swatch {
  width: 12px; height: 8px;
  border-radius: 1px;
  flex-shrink: 0;
}

/* ── BOTTOM BAR ─────────────────────────────────────────────────────────── */
#bottombar {
  grid-column: 1 / -1;
  grid-row: 3;
  border-top: 1px solid var(--faint);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 20px;
  background: var(--black);
  z-index: 50;
}
.bot-item {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.bot-item span { color: rgba(255,255,255,0.25); }
#bot-coords { color: rgba(200,255,0,0.5); }
.bot-spacer { flex: 1; }
#bot-time { color: var(--muted); }

/* coord tooltip */
#coord-tip {
  position: fixed;
  background: var(--black);
  border: 1px solid var(--lime);
  color: var(--lime);
  font-family: var(--mono);
  font-size: 9px;
  padding: 3px 8px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 300;
  display: none;
  letter-spacing: 0.1em;
}

/* fade in */
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
#shell { animation: fadein 0.5s ease both; }
</style>
</head>
<body>
<div id="shell">

  <!-- TOPBAR -->
  <div id="topbar">
    <!-- centered logo -->
    <div id="logo-wrap">
      <div id="logo-replay">REPLAY</div>
      <div id="logo-sub">by &oplus; Temporal</div>
    </div>

    <!-- right status -->
    <div id="status-right">
      <span class="stat-item" id="table-count">— TABLES</span>
      <span class="stat-item" id="badge-count">— BADGES</span>
      <div id="live-indicator">
        <div id="live-dot"></div>
        <span id="live-text">OFFLINE</span>
      </div>
    </div>
  </div>

  <!-- FLOOR PANEL -->
  <div id="floor-panel">
    <!-- Concourse on top (higher floor) -->
    <div class="floor-layer" id="tab-concourse" onclick="switchFloor('concourse')">
      <span class="fl-num">CC</span>
      <span class="fl-lbl">Concourse</span>
    </div>
    <!-- Level 00 on bottom -->
    <div class="floor-layer active" id="tab-level00" onclick="switchFloor('level00')">
      <span class="fl-num">L0</span>
      <span class="fl-lbl">Level 00</span>
    </div>
  </div>

  <!-- MAP AREA -->
  <div id="map-area">




    <div id="floor-title">MOSCONE SOUTH — LEVEL 00</div>

    <div id="map-wrap">
      <div id="map-root">
        <img id="mapimg" alt="floor plan" draggable="false" />
        <div class="reticle rt"></div>
        <div class="reticle rr"></div>
        <div class="reticle rb"></div>
        <div class="reticle rl"></div>
        <div id="dot-layer"></div>
      </div>
    </div>

    <div id="legend">
      <div class="leg-row">
        <div class="leg-swatch" style="background:rgba(200,255,0,0.1);border:1px solid rgba(200,255,0,0.3);"></div>
        Table (fixed)
      </div>
      <div class="leg-row">
        <div class="leg-swatch" style="background:var(--lime);border-radius:50%;width:8px;height:8px;box-shadow:0 0 6px var(--lime);"></div>
        <span style="color:var(--lime)">Badge (live)</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div id="bottombar">
    <span class="bot-item">MOSCONE SOUTH · SAN FRANCISCO</span>
    <span class="bot-item">MAY 05–07 · 2026</span>
    <span class="bot-item" id="sys-floor">LEVEL 00</span>
    <div class="bot-spacer"></div>
    <span class="bot-item" id="bot-coords">CLICK MAP FOR COORDS</span>
    <span class="bot-item" id="bot-time"></span>
  </div>

</div>

<div id="coord-tip"></div>

<script>
// ── Floor config ───────────────────────────────────────────────────────────
const FLOORS = {
  "level00": {
    title:     "MOSCONE SOUTH — LEVEL 00",
    sysLabel:  "LEVEL 00",
    map:       "/map-level00.PNG",
    tables: [
      { id: "table-1",  x: 74,  y: 27  },
      { id: "table-2",  x: 74,  y: 32  },
      { id: "table-3",  x: 74,  y: 41  },
      { id: "table-4",  x: 74,  y: 46  },
      { id: "table-5",  x: 93,  y: 27  },
      { id: "table-6",  x: 93,  y: 41  },
      { id: "table-7",  x: 93,  y: 46  },
      { id: "table-8",  x: 93,  y: 66 },
      { id: "table-9",  x: 93,  y: 71 },
      { id: "table-10", x: 93,  y: 75},
      { id: "table-11", x: 93,  y: 79},
      { id: "table-12", x: 93,  y: 84},
      { id: "table-13", x: 93,  y: 86},
      { id: "table-14", x: 113,  y: 66},
      { id: "table-15", x: 113,  y: 71},
      { id: "table-16", x: 113,  y: 75},
      { id: "table-17", x: 113,  y: 79},
      { id: "table-18", x: 113, y: 84},
      { id: "table-19", x: 113, y: 86},
      { id: "table-20", x: 86, y: 84},
      { id: "table-21", x: 79, y: 86},
      { id: "table-22", x: 72, y: 86},
      { id: "table-23", x: 67, y: 86},
      { id: "table-24", x: 120, y: 87},
      { id: "table-25", x: 132, y: 86},
      { id: "table-26", x: 132, y: 84},
      { id: "table-27", x: 132, y:79},
      { id: "table-28", x: 132, y: 75},
      { id: "table-29", x:132, y: 42},
      { id: "table-30", x: 132, y: 32},
      { id: "table-31", x: 132, y: 27},
      { id: "table-32", x: 151, y: 27},
      { id: "table-33", x: 171, y: 27},
      { id: "table-35", x: 151, y: 79},
      { id: "table-36", x: 151, y: 75},
      { id: "table-37", x: 151, y: 84},
      { id: "table-38", x: 151, y: 86},
      { id: "table-39", x: 163, y: 66},
      { id: "table-40", x: 163, y: 72},
      { id: "table-41", x: 163, y: 84},
      { id: "table-42", x: 170, y: 72},
      { id: "table-43", x: 176, y: 72},
      { id: "table-44", x: 176, y: 67},
      { id: "table-45", x: 176, y: 76},
      { id: "table-46", x: 176, y: 82},
      { id: "table-47", x: 176, y: 86},
    ]
  },
  "concourse": {
    title:    "MOSCONE SOUTH — THE CONCOURSE",
    sysLabel: "CONCOURSE",
    map:      "/map-concourse.PNG",
    tables:   [
      { id: "table-48", x: 59, y: 44},
      { id: "table-49", x: 59, y: 50},
      { id: "table-50", x: 59, y: 56},
      { id: "table-51", x: 88, y: 44},
      { id: "table-52", x: 88, y: 50},
      { id: "table-53", x: 88, y: 56},
      { id: "table-54", x: 117.5, y: 44},
      { id: "table-55", x: 117.5, y: 50},
      { id: "table-56", x: 117.5, y: 56},
      { id: "table-57", x: 146.5, y: 44},
      { id: "table-58", x: 146.5, y: 50},
      { id: "table-59", x: 146.5, y: 56},
      { id: "table-60", x: 164.4, y: 36},
      { id: "table-61", x: 174.3, y: 36},
      { id: "table-62", x: 184, y: 36}
    ]  // add coords after clicking on the map
  }
};


// ── Badge boundary zones per floor ────────────────────────────────────────
// Badges outside these zones are filtered out before rendering.
// Zones match the valid detection areas on each floor plan image.
const BOUNDS = {
  "level00": {
    x: [13, 170],   // exclude x < 13 and x > 170
    y: [25, 90]     // exclude y < 25 and y > 90
  },
  "concourse": {
    x: [0, 200],    // no x restriction
    y: [35, 75]     // exclude y < 35 and y > 75
  }
};

function isInBounds(floor, x, y) {
  const b = BOUNDS[floor];
  if (!b) return true;
  return x >= b.x[0] && x <= b.x[1] && y >= b.y[0] && y <= b.y[1];
}

// ── State ──────────────────────────────────────────────────────────────────
let currentFloor = "level00";
let badges = [];
let naturalW = 0, naturalH = 0;

// ── Clock ──────────────────────────────────────────────────────────────────
function tick() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('bot-time').textContent =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(tick, 1000);
tick();

// ── Map loading ────────────────────────────────────────────────────────────
const mapImg = document.getElementById('mapimg');

function loadFloorMap(id) {
  naturalW = 0; naturalH = 0;
  mapImg.src = FLOORS[id].map;
}

mapImg.onload = () => {
  naturalW = mapImg.naturalWidth;
  naturalH = mapImg.naturalHeight;
  fitMap();
};

window.addEventListener('resize', () => { fitMap(); render(); });

function fitMap() {
  if (!naturalW) return;
  const wrap  = document.getElementById('map-wrap');
  const root  = document.getElementById('map-root');
  const ratio = naturalW / naturalH;
  let w = wrap.clientWidth - 24;
  let h = w / ratio;
  if (h > wrap.clientHeight - 24) { h = wrap.clientHeight - 48; w = h * ratio; }
  root.style.width  = w + 'px';
  root.style.height = h + 'px';
  render();
}

// ── Floor switching ────────────────────────────────────────────────────────
function switchFloor(id) {
  currentFloor = id;
  badges = [];

  const root = document.getElementById('map-root');
  root.classList.add('switching');
  setTimeout(() => {
    loadFloorMap(id);
    root.classList.remove('switching');
  }, 200);

  document.querySelectorAll('.floor-layer').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');

  document.getElementById('floor-title').textContent = FLOORS[id].title;
  document.getElementById('sys-floor').textContent   = FLOORS[id].sysLabel;

  render();
}

// ── Coordinate scaling (200 × 100 grid) ───────────────────────────────────
function scale(px, py) {
  const root = document.getElementById('map-root');
  return {
    x: px / 200 * root.clientWidth,
    y: py / 100 * root.clientHeight
  };
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  if (!naturalW) return;
  const layer  = document.getElementById('dot-layer');
  layer.innerHTML = '';

  const tables = FLOORS[currentFloor].tables;

  tables.forEach(t => {
    const pos = scale(t.x, t.y);
    const el  = document.createElement('div');
    el.className  = 'table-marker';
    el.style.left = pos.x + 'px';
    el.style.top  = pos.y + 'px';

    const rect = document.createElement('div');
    rect.className = 'table-rect';
    const lbl = document.createElement('div');
    lbl.className   = 'table-label';
    lbl.textContent = t.id.toUpperCase();

    el.appendChild(rect);
    el.appendChild(lbl);
    layer.appendChild(el);
  });

  badges
    .filter(b => (!b.floor || b.floor === currentFloor) && isInBounds(currentFloor, b.x, b.y))
    .forEach(b => {
      if (b.x === undefined || b.y === undefined) return;
      const pos = scale(b.x, b.y);
      const el  = document.createElement('div');
      el.className  = 'badge-dot';
      el.style.left = pos.x + 'px';
      el.style.top  = pos.y + 'px';

      const pip = document.createElement('div');
      pip.className = 'badge-pip';
      pip.style.animationDelay = (Math.random() * 2) + 's';

      const lbl = document.createElement('div');
      lbl.className   = 'badge-label';
      lbl.textContent = (b.label || b.id.slice(-4)).toUpperCase();

      el.appendChild(pip);
      el.appendChild(lbl);
      layer.appendChild(el);
    });

  const active = badges.filter(b => !b.floor || b.floor === currentFloor);
  document.getElementById('table-count').textContent =
    tables.length + (tables.length === 1 ? ' TABLE' : ' TABLES');
  document.getElementById('badge-count').textContent =
    active.length + (active.length === 1 ? ' BADGE' : ' BADGES');
}

// ── Click for coordinates ──────────────────────────────────────────────────
document.getElementById('map-area').addEventListener('click', e => {
  const root = document.getElementById('map-root');
  const rect = root.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right ||
      e.clientY < rect.top  || e.clientY > rect.bottom) return;

  const px = ((e.clientX - rect.left) / root.clientWidth  * 200).toFixed(1);
  const py = ((e.clientY - rect.top)  / root.clientHeight * 100).toFixed(1);
  const str = `X:${px}  Y:${py}`;

  document.getElementById('bot-coords').textContent = str;

  const tip = document.getElementById('coord-tip');
  tip.textContent  = str;
  tip.style.left   = (e.clientX + 12) + 'px';
  tip.style.top    = (e.clientY - 10) + 'px';
  tip.style.display = 'block';
  navigator.clipboard?.writeText(JSON.stringify({ x: parseFloat(px), y: parseFloat(py) })).catch(() => {});
  setTimeout(() => { tip.style.display = 'none'; }, 2500);
});

// ── SSE ────────────────────────────────────────────────────────────────────
function connect() {
  const dot  = document.getElementById('live-dot');
  const text = document.getElementById('live-text');
  const es   = new EventSource('/events');

  es.onopen = () => {
    dot.classList.add('on');
    text.textContent = 'LIVE';
    text.style.color = 'var(--lime)';
  };

  es.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'badges') { badges = msg.data; render(); }
    } catch(err) { console.error('[sse]', err); }
  };

  es.onerror = () => {
    dot.classList.remove('on');
    text.textContent = 'RECONNECTING';
    text.style.color = '';
  };
}

// ── Init ───────────────────────────────────────────────────────────────────
loadFloorMap(currentFloor);
connect();
</script>
